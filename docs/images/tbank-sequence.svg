<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><style>text{font-family:Arial,sans-serif;fill:#222}.l{stroke:#777;stroke-width:2;stroke-dasharray:6 5}.a{stroke:#444;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs><text x="500" y="32" text-anchor="middle" font-size="24" font-weight="bold">Создание и подписание платёжного реестра</text><text x="80" y="75" font-size="18" font-weight="bold">Администратор</text><text x="260" y="75" font-size="18" font-weight="bold">Scheduler</text><text x="430" y="75" font-size="18" font-weight="bold">Frontend</text><text x="600" y="75" font-size="18" font-weight="bold">Backend</text><text x="780" y="75" font-size="18" font-weight="bold">БД U-Verse</text><text x="920" y="75" font-size="18" font-weight="bold">Т-Банк</text><path class="l" d="M100 90V640 M280 90V640 M450 90V640 M620 90V640 M800 90V640 M940 90V640"/><path class="a" d="M280 130 H620"/><text x="340" y="120">Запуск формирования реестра</text><path class="a" d="M620 180 H800"/><text x="660" y="170">Сохранить реестр</text><path class="a" d="M100 240 H450"/><text x="170" y="230">Открыть реестр</text><path class="a" d="M450 290 H620"/><text x="475" y="280">GET /payment-registries/{id}</text><path class="a" d="M100 350 H620"/><text x="250" y="340">Подтвердить и отправить</text><path class="a" d="M620 400 H940"/><text x="700" y="390">POST .../create-submit</text><path class="a" d="M940 450 H620"/><text x="700" y="440">202 + correlationId</text><path class="a" d="M620 520 H940"/><text x="720" y="510">Polling статуса</text><path class="a" d="M940 570 H620"/><text x="730" y="560">PROCESSING / ACCEPTED</text><path class="a" d="M620 620 H800"/><text x="680" y="610">Синхронизация статуса</text></svg>