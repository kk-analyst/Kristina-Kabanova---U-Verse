<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><style>text{font-family:Arial,sans-serif;fill:#222}.l{stroke:#777;stroke-width:2;stroke-dasharray:6 5}.a{stroke:#444;stroke-width:2;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs><text x="500" y="32" text-anchor="middle" font-size="24" font-weight="bold">Возврат пользователя с внешней платёжной формы RaifPay</text><text x="120" y="75" font-size="18" font-weight="bold">Пользователь</text><text x="330" y="75" font-size="18" font-weight="bold">Frontend U-Verse</text><text x="540" y="75" font-size="18" font-weight="bold">RaifPay</text><text x="730" y="75" font-size="18" font-weight="bold">Backend U-Verse</text><text x="900" y="75" font-size="18" font-weight="bold">БД</text><path class="l" d="M130 90V590 M350 90V590 M560 90V590 M750 90V590 M910 90V590"/><path class="a" d="M130 135 H560"/><text x="300" y="125">Выполнить оплату</text><path class="a" d="M560 175 H130"/><text x="260" y="165">Возврат через successUrl</text><path class="a" d="M130 245 H350"/><text x="170" y="235">Открыть приложение</text><path class="a" d="M350 300 H750"/><text x="430" y="290">GET /api/v1/payments/{paymentId}</text><path class="a" d="M750 350 H910"/><text x="775" y="340">Получить статус</text><path class="a" d="M910 400 H750"/><text x="790" y="390">Текущий статус</text><path class="a" d="M750 450 H350"/><text x="490" y="440">Статус платежа</text><path class="a" d="M350 500 H130"/><text x="180" y="490">Отобразить результат оплаты</text></svg>